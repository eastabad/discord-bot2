

services:
  # PostgreSQL数据库
  db:
    image: postgres:16
    container_name: discord-bot-db
    environment:
      POSTGRES_DB: discord_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: discord123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discord_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Discord Bot主服务 + API服务器
  discord-bot:
    build: .
    container_name: discord-bot-main
    environment:
      - DATABASE_URL=postgresql://postgres:discord123@db:5432/discord_bot
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
      - ./daily_logs:/app/daily_logs
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: python main_with_api.py

  # 配置Web服务器
  config-server:
    build: .
    container_name: discord-bot-config
    environment:
      - DATABASE_URL=postgresql://postgres:discord123@db:5432/discord_bot
    env_file:
      - .env
    ports:
      - "8081:8080"
    volumes:
      - ./config:/app/config
      - ./templates:/app/templates
    depends_on:
      - db
    restart: unless-stopped
    command: python config_web_server.py

  # Nginx反向代理 (生产环境)
  nginx:
    image: nginx:alpine
    container_name: discord-bot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - discord-bot
      - config-server
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data: